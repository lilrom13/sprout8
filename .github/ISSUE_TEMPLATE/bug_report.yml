name: Bug report
description: A testbench fails, the RTL misbehaves, or a tool breaks
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [RTL, Testbench, Emulator, Tools / CI, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command you ran, e.g. `make nightly SEED=1234` or `make test TB=tb_cpu`
      render: shell
    validations:
      required: true
  - type: input
    id: ghdl
    attributes:
      label: GHDL version (`ghdl --version`)
  - type: textarea
    id: log
    attributes:
      label: Relevant output (first CHECK FAILED lines)
      render: text
